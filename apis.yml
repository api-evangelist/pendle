description: >-
  Pendle is a permissionless yield tokenization protocol that splits yield-bearing assets into
  Principal Tokens (PT) and Yield Tokens (YT), enabling fixed-yield strategies and yield trading
  on-chain. The Pendle V2 REST API provides endpoints for querying markets, assets, prices, limit
  orders, liquidity pool data, implied APY, and user positions across Ethereum, Arbitrum, BSC,
  Base, Mantle, Optimism, Sonic, Berachain, and other supported chains. A Hosted SDK converts
  API calls into ready-to-broadcast transaction payloads for swaps, minting, redeeming, and
  liquidity operations.
