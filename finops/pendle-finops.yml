    aggregation: sum
    price: 0.00
    dimensions:
      - api_key
      - plan_tier
  - name: starter_weekly_subscription
    description: Flat $10/week subscription, 500 CU/min and 1,000,000 CU/week.
    unit: week
    aggregation: sum
    price: 10.00
    dimensions:
      - api_key
      - plan_tier
  - name: growth_weekly_subscription
    description: Flat $20/week subscription, 1,000 CU/min and 2,000,000 CU/week.
    unit: week
    aggregation: sum
    price: 20.00
    dimensions:
