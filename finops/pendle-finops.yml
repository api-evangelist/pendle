      - plan_tier
principles:
  - name: Visibility
    description: >-
      Tag each API key to the consuming workload or team. Monitor X-RateLimit-Remaining and
      X-RateLimit-Weekly-Remaining headers to track CU burn rate in real time.
  - name: Allocation
    description: >-
      Allocate weekly subscription cost directly to the team or product owning each API key.
      Maintain one key per bounded context to avoid cross-team attribution confusion.
  - name: Optimization
    description: >-
      Stay on the free tier for development and low-frequency queries. Upgrade only when CU
      limits are consistently saturated. Supply custom aggregator keys (KyberSwap, Odos, OKX,
      ParaSwap) via request headers to reduce Hosted SDK CU costs to zero for those aggregators.
      Use cross-chain endpoints (/v1/markets/all, /v1/assets/all) instead of per-chain loops
      to reduce total CU consumption.
  - name: Accountability
    description: >-
      Assign a billing owner per API key. Review weekly CU consumption against plan limits
      each billing period. Set alerts when weekly CU remaining drops below 20%.
