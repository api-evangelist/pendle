description: >-
  FinOps view of Pendle V2 API costs. Billing is weekly rather than monthly, using a Computing
  Unit (CU) model. The free tier has no cost. Paid plans are $10, $20, or $40 per week (flat),
  with no additional usage-based overage; instead, requests are throttled once CU limits are
  reached. Cost allocation is per API key. Hosted SDK aggregator CU costs are dynamic and can
  be zeroed out by supplying custom aggregator keys in request headers.
