openapi: 3.2.0
info:
  title: Pendle V2 API Docs Statistics API
  description: '## Terms used in the documentation/API


    Below are some terms used in the documentation/API:


    - Pendle Assets/Tokens: PT, YT, LP, SY

    - Non-Pendle Assets: other tokens that are not Pendle assets, such as USDC, USDT, DAI, etc.'
  version: '1.0'
  contact: {}
servers:
- url: http://127.0.0.1:9000
tags:
- name: Statistics
paths:
  /v1/statistics/get-distinct-user-from-token:
    get:
      description: 'Returns a list of unique wallet addresses that have interacted with a specific token across Pendle markets.


        Use the optional `chainId` parameter to filter results to a specific chain, or omit it to get users across all chains.


        Common use cases include:

        - Token holder analysis

        - User adoption metrics

        - Market participation statistics'
      operationId: StatisticsController_getDistinctUserFromToken
      parameters:
      - name: token
        required: true
        in: query
        description: Token address to query. Can be any Pendle token (PT, YT, SY, LP). Address will be normalized to lowercase.
        schema:
          example: '0x0000000000000000000000000000000000000000'
          type: string
      - name: chainId
        required: false
        in: query
        description: Optional chain ID to filter results. If provided, returns only users who interacted with the token on the specified chain. If omitted, returns users across all chains where the token exists.
        schema:
          type: number
      responses:
        '200':
          description: Array of unique wallet addresses that have interacted with the specified token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDistinctUsersFromTokenEntity'
              example:
                users:
                - '0x1234567890123456789012345678901234567890'
                - '0x0987654321098765432109876543210987654321'
                - '0xabcdefabcdefabcdefabcdefabcdefabcdefabcd'
      summary: Get distinct users for a specific token
      tags:
      - Statistics
      x-computing-unit: '3'
      x-retail-api-rank: 6969
components:
  schemas:
    GetDistinctUsersFromTokenEntity:
      type: object
      properties:
        users:
          description: Array of unique wallet addresses (lowercase) that have interacted with the specified token. Addresses are deduplicated across both Sentio and internal data sources.
          example:
          - '0x1234567890123456789012345678901234567890'
          - '0x0987654321098765432109876543210987654321'
          - '0xabcdefabcdefabcdefabcdefabcdefabcdefabcd'
          type: array
          items:
            type: string
      required:
      - users
